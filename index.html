<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xavierdpt</title>
  <style>
    :root { --bg: #fafafa; --fg: #1a1a1a; --muted: #666; --card: #fff; --border: #ddd; --accent: #0b5fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121212; --fg: #eaeaea; --muted: #999; --card: #1c1c1c; --border: #333; --accent: #6ea0ff; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
    h1 { margin: 0 0 32px; font-size: 1.8rem; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    a { display: block; padding: 16px 20px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--fg); text-decoration: none; }
    a:hover { border-color: var(--accent); }
    a strong { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>xavierdpt</h1>
    <ul>
      <li><a href="https://xavierdpt.github.io/lifeofasysadmin/"><strong>Life of a Sysadmin</strong></a></li>
    </ul>
  </main>
</body>
</html>
